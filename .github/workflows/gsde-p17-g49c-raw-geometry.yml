name: GSDE P17 G4.9C Raw Spot Geometry

on:
  push:
    branches:
      - gsde-p17-g49c-spot-geometry-20260903
    paths:
      - 'gsde-p17/g49a_spot_sync_observation_gate.py'
      - 'gsde-p17/g49b_spot_effective_domain_prereg.py'
      - 'gsde-p17/g49c_spot_raw_geometry_ri002.py'
      - '.github/workflows/gsde-p17-g49c-raw-geometry.yml'

jobs:
  raw-spot-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pillow scipy scikit-image
      - name: Download Spot-only NIST sources and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g49c/source g49c/raw g49c/raw_unsynced g49c/g49a g49c/g49b g49c/out
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          import hashlib, time
          base='https://data.nist.gov/od/ds/mds2-2525/'
          files={
            '2525_README_v200.txt':'936f4c166b448f4b5a27d1e2b2465f9c2db1be073a7bffd54d45eb4259120a65',
            'Data Synchronization Example.ipynb':'7db1c0bdf7030d2db41f247e0942af03f1aeacbc55d585d5c866793b6ab02a1f',
            'Spot on Bare Metal_Calibrated Absorption Data.csv':'0e96b220852d762fde846e406cc44c6fc874cef22e7e41db7f4025dbcc9ca274',
            'Spot on Bare Metal_XrayImages_Raw.zip':'9b2bf101742fb2bfd175a2e237da3b10ae4de512c3daa983133aae36eda949e3',
          }
          log=[]
          for name,expected in files.items():
              p=Path('g49c/source')/name; url=base+quote(name); last=None
              for attempt in range(1,6):
                  try:
                      print(f'DOWNLOAD {name} attempt={attempt}',flush=True)
                      req=Request(url,headers={'User-Agent':'Mozilla/5.0 GSDE scientific replay'})
                      tmp=p.with_suffix(p.suffix+'.part')
                      if tmp.exists(): tmp.unlink()
                      with urlopen(req,timeout=240) as r,tmp.open('wb') as f:
                          while True:
                              b=r.read(1024*1024)
                              if not b: break
                              f.write(b)
                      h=hashlib.sha256(tmp.read_bytes()).hexdigest(); size=tmp.stat().st_size
                      print(f'RECEIVED {name} bytes={size} sha256={h}',flush=True)
                      if h!=expected: raise RuntimeError(f'CHECKSUM FAIL {h} != {expected}')
                      tmp.replace(p); log.append((name,size,h,attempt,url)); last=None; break
                  except Exception as e:
                      last=repr(e); print(f'RETRY {name} attempt={attempt} {last}',flush=True); time.sleep(min(5*attempt,20))
              if last is not None: raise SystemExit(f'NIST transport failed {name}: {last}')
          Path('g49c/out/NIST_SPOT_G49C_CUSTODY.tsv').write_text('name\tbytes\tsha256\tattempt\turl\n'+'\n'.join('\t'.join(map(str,x)) for x in log)+'\n',encoding='utf-8')
          PY
      - name: Prove Scan holdout untouched
        shell: bash
        run: |
          set -euo pipefail
          if find g49c -type f -iname 'Scan on Bare Metal*' | grep -q .; then echo 'HOLDOUT BREACH' >&2; exit 9; fi
          printf 'SCAN_HOLDOUT_DOWNLOADED=FALSE\nSCAN_HOLDOUT_INSPECTED=FALSE\n' > g49c/out/SCAN_HOLDOUT_SEAL.txt
      - name: Extract raw Spot X-rays
        run: unzip -q 'g49c/source/Spot on Bare Metal_XrayImages_Raw.zip' -d g49c/raw
      - name: Inventory and partition unsynchronized raw frames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,shutil
          root=Path('g49c/raw'); quarantine=Path('g49c/raw_unsynced'); quarantine.mkdir(parents=True,exist_ok=True)
          rows=[]; by={}; unparsed=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.tif','.tiff'}: continue
              m=re.search(r'(\d{3})(?=\.(?:tif|tiff)$)',p.name,re.I)
              if not m:
                  unparsed.append(str(p.relative_to(root))); continue
              n=int(m.group(1)); rows.append((n,str(p.relative_to(root))))
              by.setdefault(n,[]).append(p)
          frames=sorted(by)
          dup={n:[str(x.relative_to(root)) for x in ps] for n,ps in by.items() if len(ps)>1}
          sync=set(range(1,228)); actual=set(frames)
          if not sync.issubset(actual): raise SystemExit(f'MISSING SYNCHRONIZED RAW FRAMES {sorted(sync-actual)}')
          if dup: raise SystemExit(f'DUPLICATE RAW FRAME IDS {dup}')
          extras=sorted(actual-sync)
          for n in extras:
              p=by[n][0]; dest=quarantine/p.name; shutil.move(str(p),str(dest))
          summary={
            'raw_archive_frame_min':min(frames),'raw_archive_frame_max':max(frames),'raw_archive_frame_count':len(frames),
            'synchronized_frame_min':1,'synchronized_frame_max':227,'synchronized_frame_count':227,
            'unsynchronized_extra_frame_count':len(extras),'unsynchronized_extra_first':extras[0] if extras else None,
            'unsynchronized_extra_last':extras[-1] if extras else None,'unsynchronized_extra_frames':extras,
            'unparsed_file_count':len(unparsed),'duplicate_frame_id_count':len(dup),
            'firewalls':['RAW_ARCHIVE_DOMAIN != SYNCHRONIZED_OBSERVATION_DOMAIN','UNSYNCHRONIZED_RAW_FRAME != RI002_INPUT','NO_TEMPORAL_ANCHOR => NO_EMPIRICAL_CREDIT']
          }
          Path('g49c/out/RAW_ARCHIVE_DOMAIN_INVENTORY.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          Path('g49c/out/RAW_ARCHIVE_FRAME_INVENTORY.tsv').write_text('frame\tpath\n'+'\n'.join(f'{n}\t{path}' for n,path in rows)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - name: Reproduce G4.9A exact mapping
        run: python gsde-p17/g49a_spot_sync_observation_gate.py g49c/source g49c/g49a
      - name: Reproduce G4.9B calibrated effective domain
        run: python gsde-p17/g49b_spot_effective_domain_prereg.py g49c/source g49c/g49a g49c/g49b
      - name: Execute G4.9C raw geometry and RI002 kinematics
        run: python gsde-p17/g49c_spot_raw_geometry_ri002.py g49c/raw g49c/g49a/SPOT_DEVELOPMENT_FRAME_MAP_080_227.csv g49c/g49b/SPOT_EFFECTIVE_DOMAIN_MAP.csv g49c/out
      - name: Bind archive-domain firewall into adjudication
        shell: bash
        run: |
          {
            echo 'RAW_ARCHIVE_DOMAIN != SYNCHRONIZED_OBSERVATION_DOMAIN'
            echo 'UNSYNCHRONIZED_RAW_FRAMES_228_451=QUARANTINED_NO_RI002_CREDIT'
            echo 'NO_TEMPORAL_ANCHOR => NO_EMPIRICAL_CREDIT'
          } >> g49c/out/G49C_ADJUDICATION.txt
      - name: Hard gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^G4_9C_SPOT_RAW_CUSTODY=PASS$' g49c/out/G49C_ADJUDICATION.txt
          grep -q '^SPOT_RAW_FRAME_COVERAGE_001_227_EXACT=TRUE$' g49c/out/G49C_ADJUDICATION.txt
          grep -q '^UNSYNCHRONIZED_RAW_FRAMES_228_451=QUARANTINED_NO_RI002_CREDIT$' g49c/out/G49C_ADJUDICATION.txt
          grep -q '^SCAN_HOLDOUT_DOWNLOADED=FALSE$' g49c/out/G49C_ADJUDICATION.txt
          grep -q '^EMPIRICAL_BENCHMARK_EXECUTED=FALSE$' g49c/out/G49C_ADJUDICATION.txt
      - name: Record execution context
        run: |
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_REF=$GITHUB_REF"
            python --version
            pip freeze
          } > g49c/out/EXECUTION_CONTEXT.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gsde-p17-g49c-raw-geometry-evidence
          path: g49c/out
          if-no-files-found: error
          retention-days: 30
