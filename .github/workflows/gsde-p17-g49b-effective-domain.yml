name: GSDE P17 G4.9B Effective Domain Preregistration

on:
  push:
    branches:
      - gsde-p17-g49a-spot-sync-20260903
    paths:
      - 'gsde-p17/g49a_spot_sync_observation_gate.py'
      - 'gsde-p17/g49b_spot_effective_domain_prereg.py'
      - '.github/workflows/gsde-p17-g49b-effective-domain.yml'

jobs:
  effective-domain-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Download Spot synchronization sources from NIST and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g49b/source g49b/g49a g49b/out
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          import hashlib, time
          base='https://data.nist.gov/od/ds/mds2-2525/'
          files={
            '2525_README_v200.txt':'936f4c166b448f4b5a27d1e2b2465f9c2db1be073a7bffd54d45eb4259120a65',
            'Data Synchronization Example.ipynb':'7db1c0bdf7030d2db41f247e0942af03f1aeacbc55d585d5c866793b6ab02a1f',
            'Spot on Bare Metal_Calibrated Absorption Data.csv':'0e96b220852d762fde846e406cc44c6fc874cef22e7e41db7f4025dbcc9ca274',
          }
          log=[]
          for name,expected in files.items():
              p=Path('g49b/source')/name; url=base+quote(name); last=None
              for attempt in range(1,6):
                  try:
                      req=Request(url,headers={'User-Agent':'Mozilla/5.0 GSDE scientific replay'})
                      tmp=p.with_suffix(p.suffix+'.part')
                      if tmp.exists(): tmp.unlink()
                      with urlopen(req,timeout=180) as r,tmp.open('wb') as f:
                          while True:
                              b=r.read(1024*1024)
                              if not b: break
                              f.write(b)
                      h=hashlib.sha256(tmp.read_bytes()).hexdigest(); size=tmp.stat().st_size
                      if h!=expected: raise RuntimeError(f'CHECKSUM FAIL {h} != {expected}')
                      tmp.replace(p); log.append((name,size,h,attempt,url)); last=None; break
                  except Exception as e:
                      last=repr(e); print(f'RETRY {name} attempt={attempt} {last}',flush=True); time.sleep(min(5*attempt,20))
              if last is not None: raise SystemExit(f'NIST transport failed {name}: {last}')
          Path('g49b/out/NIST_SPOT_SYNC_CUSTODY.tsv').write_text('name\tbytes\tsha256\tattempt\turl\n'+'\n'.join('\t'.join(map(str,x)) for x in log)+'\n',encoding='utf-8')
          PY
      - name: Prove Scan holdout untouched
        shell: bash
        run: |
          set -euo pipefail
          if find g49b -type f -iname 'Scan on Bare Metal*' | grep -q .; then
            echo 'HOLDOUT BREACH' >&2; exit 9
          fi
          printf 'SCAN_HOLDOUT_DOWNLOADED=FALSE\nSCAN_HOLDOUT_INSPECTED=FALSE\n' > g49b/out/SCAN_HOLDOUT_SEAL.txt
      - name: Reproduce G4.9A exact mapping
        run: python gsde-p17/g49a_spot_sync_observation_gate.py g49b/source g49b/g49a
      - name: Execute G4.9B effective-domain freeze
        run: python gsde-p17/g49b_spot_effective_domain_prereg.py g49b/source g49b/g49a g49b/out
      - name: Hard gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^SYNCHRONIZED_FRAME != CALIBRATED_BENCHMARK_FRAME$' g49b/out/G49B_ADJUDICATION.txt
          grep -q '^BLOCKED_TEMPORAL_CV_REQUIRED=TRUE$' g49b/out/G49B_ADJUDICATION.txt
          grep -q '^RANDOM_ROW_CV=FORBIDDEN$' g49b/out/G49B_ADJUDICATION.txt
          grep -q '^SCAN_HOLDOUT_DOWNLOADED=FALSE$' g49b/out/G49B_ADJUDICATION.txt
      - name: Record execution context
        run: |
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_REF=$GITHUB_REF"
            python --version
            pip freeze
          } > g49b/out/EXECUTION_CONTEXT.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gsde-p17-g49b-effective-domain-prereg-evidence
          path: g49b/out
          if-no-files-found: error
          retention-days: 30
